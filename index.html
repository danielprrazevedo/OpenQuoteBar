<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <!--
    No user-visible text lives here: every string comes from src/strings.ts, so
    there is a single place to touch when another language is added.
  -->
  <body>
    <main class="shell">
      <section class="view" id="view-balance">
        <header class="view__header">
          <span class="mark" aria-hidden="true">$</span>
          <h1 class="view__title" id="balance-title"></h1>
          <button class="link link--end" type="button" id="refresh"></button>
        </header>

        <div class="hero">
          <span class="hero__label" id="total-label"></span>
          <div class="hero__totals" id="totals"></div>
          <span class="hero__meta" id="balance-meta"></span>
        </div>

        <ul class="balances" id="balance-providers" aria-live="polite"></ul>

        <p class="hint hint--status" id="balance-status" role="status"></p>

        <footer class="view__footer">
          <span class="meta" id="balance-footer"></span>
          <button class="link link--end" type="button" id="open-settings"></button>
        </footer>
      </section>

      <section class="view" id="view-settings" hidden>
        <header class="view__header">
          <h1 class="view__title" id="settings-title"></h1>
          <button class="link link--end" type="button" id="close-settings"></button>
        </header>

        <h2 class="section__title" id="settings-general"></h2>
        <ul class="settings">
          <li class="setting">
            <span class="setting__text">
              <span class="setting__label" id="open-window-on-start-label"></span>
              <span class="setting__hint" id="open-window-on-start-hint"></span>
            </span>
            <input class="switch" type="checkbox" id="open-window-on-start" />
          </li>

          <li class="setting">
            <span class="setting__text">
              <span class="setting__label" id="launch-at-login-label"></span>
              <span class="setting__hint" id="launch-at-login-hint"></span>
            </span>
            <input class="switch" type="checkbox" id="launch-at-login" />
          </li>

          <li class="setting">
            <span class="setting__text">
              <span class="setting__label" id="poll-interval-label"></span>
              <span class="setting__hint" id="poll-interval-hint"></span>
            </span>
            <select class="select" id="poll-interval"></select>
          </li>
        </ul>

        <h2 class="section__title" id="settings-providers"></h2>
        <ul class="settings" id="providers" aria-live="polite"></ul>

        <p class="hint hint--status" id="settings-status" role="status"></p>

        <footer class="view__footer">
          <span class="meta" id="settings-app-info"></span>
        </footer>
      </section>
    </main>

    <!-- The tray popover renders here; it is empty in the main window. -->
    <div id="popup-root"></div>
  </body>
</html>
