<!--
  The tray icon for macOS: the same dollar sign, but black on transparency.

  macOS renders a "template image" by using the alpha channel as a mask and
  tinting it for light and dark menu bars, so the colour here is irrelevant —
  only the shape matters. Keep it monochrome.

  Regenerate the PNG the app embeds with:

    pnpm tauri icon design/tray-icon.svg -p 88 -o src-tauri/icons/tray

  The short flags are not a style choice: a comment may not contain a double
  hyphen, so the long forms cannot be written here.

  88 px rather than 22 or 44: the tray layer normalises the image to 18 points
  of height and scales the width to match, so a generously sized square is what
  keeps it crisp on every display density.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100"
  height="100"
  viewBox="0 0 100 100"
  fill="none"
>
  <g
    stroke="#000000"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  >
    <path
      d="M 68 30 C 60 21 40 21 36 31 C 32 41 47 46 52 50 C 58 55 70 60 65 70 C 60 79 39 79 33 70"
    />
    <line x1="50" y1="12" x2="50" y2="88" />
  </g>
</svg>
